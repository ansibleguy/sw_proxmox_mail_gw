---

- name: Converge - default
  hosts: test-ag-pmg-1
  vars:
    no_prompts: true
    pmg:
      fqdn: 'pmg1.test.oxl.at'

      nginx:
        aliases: ['alias.lan', '_']
        ip: '192.168.7.2'
        ssl:
          mode: 'snakeoil'

  roles:
    - oxlorg.proxmox_mail_gw

- name: Converge - no nginx
  hosts: test-ag-pmg-2
  vars:
    no_prompts: true
    subscription: true
    pmg:
      fqdn: 'pmg2.test.oxl.at'

      manage:
        webserver: false

  roles:
    - oxlorg.proxmox_mail_gw
